name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.repository == 'julpel8/hyprmnesia' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'chore: release v')))
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          VERSION="$(bun -e "
            const path = 'package.json'
            const pkg = await Bun.file(path).json()
            const [major, minor, patch] = pkg.version.split('.').map(Number)
            pkg.version = [major, minor, patch + 1].join('.')
            await Bun.write(path, JSON.stringify(pkg, null, 2) + '\n')
            console.log(pkg.version)
          ")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync version across crates
        run: bun run sync-version

      - name: Commit and tag
        shell: bash
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

  build:
    name: Build ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            fakeroot \
            ffmpeg \
            imagemagick \
            libayatana-appindicator3-dev \
            libayatana-appindicator3-1 \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-0 \
            libgtk-3-dev \
            libxdo-dev \
            libxdo3 \
            pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          VERSION="$(bun -e "const pkg = await Bun.file('package.json').json(); console.log(pkg.version)")"
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "Tag $TAG does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Build release binary
        run: bun run build

      - name: Package installers
        run: bun run package

      - name: Smoke packaged release
        shell: bash
        run: |
          HPM="$(find artifacts/staging -mindepth 2 -maxdepth 2 -type f -name hpm | sort | head -n 1)"
          if [[ -z "$HPM" ]]; then
            echo "Packaged hpm not found under artifacts/staging" >&2
            find artifacts/staging -maxdepth 3 -type f | sort >&2
            exit 1
          fi
          "$HPM" version
          "$HPM" --help
          "$HPM" _smoke-release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/hyprmnesia-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p artifacts
          find release-artifacts -type f -name 'hyprmnesia-*' -exec cp '{}' artifacts/ \;
          bun run release-notes -- "$TAG"
          bun run checksums

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mapfile -t ASSETS < <(find artifacts -type f ! -name 'RELEASE_NOTES.md' | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Hyprmnesia $TAG" --notes-file artifacts/RELEASE_NOTES.md --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Hyprmnesia $TAG" --notes-file artifacts/RELEASE_NOTES.md --latest
          fi
