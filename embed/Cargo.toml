[package]
name = "hpm-embed"
version = "0.0.1"
edition = "2021"

[dependencies]
anyhow = "1"
hf-hub = "0.3"
hpm-util = { path = "../util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
